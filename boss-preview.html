<!doctype html>
<!-- 司令の動きを確かめるページ（物語は流れない）。ボタンで各動きを呼び出し、声に合わせた口の動きも試せる -->
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>司令の動き</title>
<style>
:root{--bg:#0E1520;--fg:#F1F3F6;--sub:#A9B4C4;--gold:#F0B94A;--line:#2B3A52;--panel:#172131}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Hiragino Sans',system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
h1{font-size:17px;margin:0 0 4px;color:var(--gold)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(120% 60% at 50% 38%,#1B2A40 0%,var(--bg) 70%)}
.bossWrap{position:relative;width:100%;height:100%;display:grid;place-items:center;will-change:transform}
.bossWrap canvas{grid-area:1/1;position:relative}
.bossWrap canvas+canvas{z-index:1} /* 口とまぶたは絵より上 */
.say{min-height:3.2em;font-size:16px;font-weight:700;line-height:1.6;padding:8px 2px;color:var(--fg)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);font-size:14px;font-weight:700}
.btns button.wide{grid-column:span 3;background:var(--gold);color:#1A1408;border-color:var(--gold)}
.small{font-size:12px;color:var(--sub);margin:6px 0 0}
</style></head><body>
<h1>司令の動き（確認用）</h1>
<div class="stage"><div class="bossWrap" id="wrap"><canvas id="cv"></canvas><canvas id="fx"></canvas></div></div>
<div class="say" id="say">何もしなくても、息・首・しっぽ・マント・まばたきが動き続けます。ときどき自分から大きく動きます。</div>
<div class="btns">
  <button class="wide" id="talk">話す（声と口の動き）</button>
  <button data-a="look">見回す</button><button data-a="bow">会釈</button><button data-a="stretch">のび</button>
  <button data-a="hop">跳ねる</button><button data-a="wag">しっぽ</button><button data-a="startle">びくっ</button>
  <button data-a="peek">去って、のぞく</button><button data-a="dive">潜って、出る</button><button data-a="close">顔を近づける</button>
  <button data-a="leap">大ジャンプ</button><button data-a="wink">ウインク</button><button id="away">いなくなる</button><button id="back" class="">戻ってくる</button>
</div>
<p class="small"><span id="fps">なめらかさ：測定中</span>　声：VOICEVOX:波音リツ</p>
<script src="bossgl.js"></script>
<script>
var player=new Audio(), env={}, idx={}, playing=false, file=null, playStart=0;
player.addEventListener('playing',function(){ playStart=performance.now(); });
fetch('voice/env.json').then(function(r){return r.json();}).then(function(j){env=j;});
fetch('voice/index.json').then(function(r){return r.json();}).then(function(j){idx=j.boss||{};});
// bossgl.js が毎コマ読む「いまの口の開き」
function bossMouth(){
  if(!playing||!file||player.paused) return 0;
  var pt=player.currentTime>0.05?player.currentTime:(performance.now()-playStart)/1000, e=env[file], k=Math.floor(pt*25);
  return e&&k<e.length?(+e[k])/9:0;
}
BossGL.init(document.getElementById('cv'),document.getElementById('fx'));
var LINES=['こちらヤマタ司令。','任務完了。','よくやった。','エージェント諸君、あらためて名乗ろう。','次の任務地は、絲原記念館だ。'];
document.getElementById('talk').onclick=function(){
  var have=LINES.filter(function(t){ return idx[t]; }), t=have[Math.floor(Math.random()*have.length)];
  if(!t) return; file=idx[t]; document.getElementById('say').textContent=t;
  player.src='voice/'+file; player.play().then(function(){ playing=true; }).catch(function(){});
};
player.onended=function(){ playing=false; };
document.querySelectorAll('[data-a]').forEach(function(b){ b.onclick=function(){ BossGL.act(b.dataset.a); }; });
// なめらかさ: 1秒に描けたコマ数（30 に近いほどなめらか。20 を切るとカクつく）
setInterval(function(){ var f=BossGL.fps(); document.getElementById('fps').textContent='なめらかさ：'+f+' コマ/秒'+(f>=25?'（良好）':f>=18?'（やや重い）':'（重い）'); },1000);
document.getElementById('away').onclick=function(){ BossGL.leave(); };
document.getElementById('back').onclick=function(){ BossGL.enter(); };
</script>
</body></html>
